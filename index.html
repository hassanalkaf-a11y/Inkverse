<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkverse</title>
<meta name="description" content="مكتبة قصص قصيرة بالعربي — اقرأ، قيّم، واترك ملاحظتك.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Inkverse">
<meta property="og:title" content="Inkverse">
<meta property="og:description" content="مكتبة قصص قصيرة بالعربي — اقرأ، قيّم، واترك ملاحظتك.">
<meta property="og:url" content="https://hassanalkaf-a11y.github.io/Inkverse/">
<meta property="og:image" content="https://hassanalkaf-a11y.github.io/Inkverse/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hassanalkaf-a11y.github.io/Inkverse/og.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="application-name" content="Inkverse">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inkverse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:#0a0a0a;--s2:#111;--s3:#171717;--line:#1c1c1c;--line2:#2a2a2a;
  --ink:#eee6d8;--muted:#857d70;--dim:#5a544b;
  --gold:#c9a35a;--gold2:#e7cd94;--goldd:#7d6230;--goldline:rgba(201,163,90,.28);
  --display:"Amiri",serif;--ui:"IBM Plex Sans Arabic",system-ui,sans-serif;--latin:"Cormorant Garamond",serif;
}
#a2hs{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;background:rgba(10,10,10,.96);border:1px solid var(--goldline);border-radius:16px;padding:16px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.7);transform:translateY(140%);transition:transform .5s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#a2hs.on{transform:none}
#a2hs h5{margin:0 0 6px;font-family:var(--display);font-size:19px;color:var(--gold2);font-weight:700}
#a2hs p{margin:0;font-size:14px;line-height:1.9;color:var(--ink)}
#a2hs .sh{display:inline-flex;vertical-align:-4px;color:var(--gold)}
#a2hs .x{position:absolute;top:8px;left:10px;background:none;border:0;color:var(--muted);font-size:22px;padding:4px 8px;cursor:pointer}
#a2hs .go{margin-top:10px;background:var(--gold);color:#000;border:0;border-radius:10px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000}
body{margin:0;color:var(--ink);font:15px/1.65 var(--ui);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 70% 40% at 50% -8%,rgba(201,163,90,.09),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.9))}
button{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* header */
body>header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;height:64px}
.brand{display:flex;align-items:center;gap:10px;margin-left:auto}
.brand img{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2)}
.brand b{font-family:var(--latin);font-weight:600;font-size:25px;letter-spacing:.06em;color:var(--gold2)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink);font-size:18px}
.iconbtn:hover{border-color:var(--line2)}
.iconbtn.gold{color:#000;background:var(--gold)}
.searchrow{display:none;padding:0 0 12px}
.searchrow.on{display:block}
.searchrow input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);color:var(--ink);font:inherit;font-size:16px;padding:10px 2px;outline:none}
.searchrow input:focus{border-color:var(--gold)}
.searchrow input::placeholder{color:var(--dim)}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:none;color:var(--muted);font-size:14px;padding:4px 0 12px;cursor:pointer;position:relative}
.tab b{font-weight:400;color:var(--dim);font-size:12px;margin-inline-start:4px}
.tab.on{color:var(--gold2)}
.tab.on::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;background:var(--gold)}

/* intro */
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:34px 0 8px}
.intro h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin:0}
.intro p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.filters{display:flex;gap:14px}
select{appearance:none;-webkit-appearance:none;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line2);font:inherit;font-size:13.5px;padding:6px 2px 6px 18px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:left 6px center,left 1px center;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#111;color:var(--ink)}
.adminbar{margin-top:18px;padding:10px 14px;font-size:13px;color:var(--gold2);border:1px solid var(--goldline);border-radius:6px;background:rgba(201,163,90,.04)}
.adminbar[hidden]{display:none}

/* continue */
.cont{display:flex;gap:16px;align-items:center;margin-top:22px;padding:14px 16px;cursor:pointer;background:var(--s1);border:1px solid var(--line);border-inline-start:2px solid var(--gold);border-radius:6px}
.cont .cover{width:54px;flex:none;--tf:10px;padding:8px 6px}
.cont .cover .ca,.cont .cover .orn,.cont .cover .badge,.cont .cover .pdfdot,.cont .cover .fav,.cont .cover .pb{display:none}
.cont .k{font-size:12px;color:var(--gold)}
.cont .t{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25}
.cont .p{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.cont .bar2{height:2px;background:var(--line2);max-width:280px}.cont .bar2 i{display:block;height:100%;background:var(--gold)}
.cont .go{margin-inline-start:auto}

/* shelves */
.grid{padding:26px 0 80px}
.shelf{display:flex;align-items:flex-end;padding:0 4px;min-height:110px}
.ledge{height:1px;margin:0 0 46px;position:relative;background:linear-gradient(90deg,transparent,var(--goldd) 12%,var(--gold) 50%,var(--goldd) 88%,transparent)}
.ledge::after{content:"";position:absolute;inset-inline:6%;top:1px;height:26px;background:radial-gradient(ellipse 50% 100% at 50% 0,rgba(201,163,90,.10),transparent 70%)}
.card{cursor:pointer;flex:0 0 var(--bw,130px);transition:transform .25s ease;transform-origin:bottom}
.card:hover{transform:translateY(-6px)}
.cover{aspect-ratio:2/3;position:relative;overflow:hidden;border-radius:7px 3px 3px 7px;padding:16px 12px 12px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;
  border:1px solid rgba(201,163,90,.18);box-shadow:-6px 8px 18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
.cover::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(0,0,0,.5));border-inline-end:1px solid rgba(201,163,90,.18)}
.cover::after{content:"";position:absolute;inset:7px;inset-inline-start:13px;border:1px solid rgba(201,163,90,.3);pointer-events:none}
.cover.img::after{display:none}.cover.img::before{background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08));border:0}
.cover.img .badge{background:rgba(0,0,0,.6);padding:1px 6px;border-radius:999px}
.cover .ct{font-family:var(--display);font-weight:700;font-size:var(--tf,19px);line-height:1.25;color:var(--gold2);position:relative;z-index:1;padding-inline-start:4px}
.cover .ca{font-size:10.5px;color:var(--gold);opacity:.8;position:relative;z-index:1;padding-inline-start:4px}
.cover .orn{position:absolute;left:50%;top:53%;width:34%;transform:translate(-50%,-50%);color:var(--gold);opacity:.45}
.cover .orn svg{display:block;width:100%;height:auto}
.cover .pb{position:absolute;inset-inline:8px 0;bottom:0;height:2px;background:rgba(255,255,255,.06);z-index:2}
.cover .pb i{display:block;height:100%;background:var(--gold)}
.badge{position:absolute;top:10px;inset-inline-end:10px;z-index:2;font-size:10px;color:var(--gold2);display:inline-flex;gap:3px;align-items:center}
.fav{position:absolute;top:0;inset-inline-end:14px;z-index:3;width:14px;height:22px;background:var(--gold);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.pdfdot{position:absolute;bottom:9px;inset-inline-end:9px;z-index:2;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.empty{width:100%;text-align:center;color:var(--muted);padding:30px 10px;font-family:var(--display);font-size:20px}
.empty .ic{width:34px;height:34px;color:var(--gold);opacity:.7;display:block;margin:0 auto 8px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
.scrim.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--line2);border-top-color:var(--goldline);border-radius:14px;max-width:680px;width:100%;max-height:90vh;overflow:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.9)}
.close{position:absolute;top:14px;inset-inline-end:14px;z-index:3}
.mhead{display:flex;gap:22px;padding:28px 24px 18px;align-items:flex-start}
.mhead .cover{width:132px;flex:none;--tf:20px}
.mbody{flex:1;min-width:0}
.mbody h3{font-family:var(--display);font-size:32px;line-height:1.2;margin:0 0 2px}
.mbody .by{color:var(--gold);font-family:var(--display);font-size:18px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line2);padding:2px 10px;border-radius:999px}
.summary{margin:0;padding:0 24px 20px;font-family:var(--display);font-size:18px;line-height:1.9;color:#d9d1c3}
.section{padding:0 24px 22px}
.section h4{font-size:12px;font-weight:500;color:var(--gold);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.section h4::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-size:14px;padding:10px 16px;border-radius:6px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold)}
.btn.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,163,90,.06)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#000;font-weight:600}
.btn.primary:hover{background:var(--gold2)}
.btn.big{padding:13px 22px;font-size:15px}
.btn.danger{color:#d98a7c}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.stars{display:flex;gap:6px;font-size:22px;cursor:pointer;user-select:none}
.stars span{color:var(--line2)}.stars span.on{color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
textarea,.field input,.field select{width:100%;font:inherit;background:#050505;color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:10px 12px}
.field select{background-image:none;padding:10px 12px}
textarea:focus,.field input:focus{outline:none;border-color:var(--gold)}
.form{padding:30px 24px 24px;display:grid;gap:14px}
.form h3{font-family:var(--display);margin:0;font-size:28px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:#0b0b0b;color:var(--gold2);border:1px solid var(--goldline);padding:10px 18px;border-radius:6px;font-size:14px;transition:transform .25s;z-index:60;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}

/* reader */
.reader{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column}
.reader.on{display:flex}
.rbar{padding-top:calc(8px + env(safe-area-inset-top))!important;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.rbar .rt{flex:1;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold2);padding:0 6px}
.rbtn{width:40px;height:40px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;font-size:17px}
.rbtn:disabled{opacity:.3}
.rbtn.marked{background:var(--gold);color:#000;border-color:var(--gold)}
.rprog{height:1px;background:var(--line)}.rprog i{display:block;height:100%;background:var(--gold);transition:width .2s}
.rstage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:14px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 60px;width:max-content;min-width:100%}
.pslot{position:relative;background:#f3efe6;box-shadow:0 0 0 1px #1a1a1a,0 12px 30px rgba(0,0,0,.7)}
.pslot span{position:absolute;inset:0;display:grid;place-items:center;color:#bbb;font-size:13px}
.pslot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rtext{max-width:640px;width:100%;padding:34px 22px 90px;font-family:var(--display);font-size:21px;line-height:2.05;color:#e3dbcc;white-space:normal}
.rtext p{margin:0 0 1.1em;text-align:justify;text-justify:inter-word}
.rtext p[dir="ltr"]{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.75;font-size:1.08em}
.rtext h2{font-size:1.25em;color:var(--gold2);text-align:center;margin:2.2em 0 1.2em;font-weight:700}
.sthead{text-align:center;margin:10px 0 2.4em;padding-bottom:1.6em;border-bottom:1px solid var(--line2)}
.stcover{display:block;width:78%;max-width:320px;margin:0 auto 1.6em;filter:brightness(.8) saturate(.85);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 50%,transparent 74%);mask-image:radial-gradient(circle at 50% 50%,#000 50%,transparent 74%)}
.stcover.inv{width:72%;max-width:300px;filter:invert(1) sepia(.45) saturate(.9) brightness(.82)}
.sthead h1{font-size:1.9em;line-height:1.3;margin:0 0 .3em;color:var(--gold2)}
.stmeta{font-family:var(--ui);font-size:13px;color:var(--muted)}
.rtext p.stclue{text-align:center;direction:ltr;font-family:"Cormorant Garamond",Georgia,serif;color:var(--gold2);letter-spacing:.06em;font-size:1.05em;margin:1.2em 0 1.4em}
.stbreak,.stend{text-align:center;color:var(--gold);margin:1.6em 0;letter-spacing:.2em}
.stend{font-size:15px;margin-top:3em;color:var(--muted)}
.rnav{padding-bottom:calc(10px + env(safe-area-inset-bottom))!important;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.rnav .rbtn{flex:1;height:46px;width:auto}
.rpage{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rpage input{width:60px;background:#0b0b0b;color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:7px;text-align:center;font:inherit}
.rload{color:var(--muted);margin:auto;text-align:center;font-family:var(--display);font-size:19px}
.rmarks{display:none;position:absolute;top:58px;inset-inline-start:10px;z-index:3;background:#0b0b0b;border:1px solid var(--line2);border-radius:10px;min-width:220px;max-height:50vh;overflow:auto;padding:6px;box-shadow:0 20px 50px #000}
.rmarks.on{display:block}
.rmarks h5{margin:6px 10px;font-size:12px;font-weight:500;color:var(--gold)}
.rmarks button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:10px;border-radius:6px;cursor:pointer}
.rmarks button:hover{background:#151515}
.rmarks .none{color:var(--muted);padding:6px 10px 10px;font-size:13px}


/* splash: the gold line draws, then the app icon rises out of it */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse 60% 45% at 50% 45%,#121110 0%,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-rise{width:260px;height:132px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
#splash .sp-icon{width:110px;height:110px;margin-bottom:6px;overflow:visible;transform:translateY(130px) scale(.85);opacity:0;filter:drop-shadow(0 0 0 rgba(231,205,148,0))}
#splash .sp-line{width:0;height:1px;background:linear-gradient(90deg,transparent,#8f6a2c 15%,#f6dfa0 50%,#8f6a2c 85%,transparent);box-shadow:0 0 12px rgba(231,205,148,.55)}
#splash .sp-word{margin-top:26px;font-family:var(--latin);font-weight:500;font-size:40px;letter-spacing:.3em;margin-inline-start:.3em;direction:ltr;display:flex;
  background:linear-gradient(100deg,#8f6a2c 0%,#e7cd94 30%,#fff3cf 45%,#e7cd94 60%,#8f6a2c 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .sp-word span{opacity:0;transform:translateY(-10px);filter:blur(6px);display:inline-block}
#splash.go .sp-line{animation:spLine 1s cubic-bezier(.65,0,.35,1) .1s forwards}
#splash.go .sp-icon{animation:spRiseIcon 1.1s cubic-bezier(.2,1.25,.35,1) 1.05s forwards}
#splash.go .sp-word span{animation:spWord .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(1.85s + var(--i)*.07s)}
#splash.go .sp-word{animation:spShine 2s ease 2.4s forwards}
@keyframes spLine{to{width:240px}}
@keyframes spRiseIcon{0%{transform:translateY(130px) scale(.85);opacity:1}100%{transform:none;opacity:1;filter:drop-shadow(0 0 14px rgba(231,205,148,.35))}}
@keyframes spWord{to{opacity:1;transform:none;filter:none}}
@keyframes spShine{to{background-position:0 0}}
@media (max-width:560px){#splash .sp-word{font-size:30px}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .intro{margin-top:26px}.intro h1{font-size:32px}
  .filters{width:100%}.filters select{flex:1}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:92vh;border-inline:0;border-bottom:0}
  .modal::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line2);margin:10px auto 0}
  .mhead{padding:16px 18px 14px;gap:16px}.mhead .cover{width:104px;--tf:16px}
  .mbody h3{font-size:26px}
  .summary,.section{padding-inline:18px}
  .grid2{grid-template-columns:1fr}
  .ledge{margin-bottom:38px}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-rise"><svg class="sp-icon" viewBox="0 0 24 24"><defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dfa0"/><stop offset=".5" stop-color="#c9963f"/><stop offset="1" stop-color="#e8c47a"/></linearGradient></defs><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z" fill="none" stroke="url(#spg)" stroke-width="1.1" stroke-linejoin="round"/><path d="M12 6.5v13" stroke="#d6a956" stroke-width="1.1" stroke-linecap="round"/></svg></div>
  <div class="sp-line"></div>

5L19 7.5\"/></svg>", "star": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"><path d=\"M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z\"/></svg>", "left": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/></svg>", "right": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 5l7 7-7 7\"/></svg>", "zin": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M20 20l-4.2-4.2M11 8.5v5M8.5 11h5\"/></svg>", "zout": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M20 20l-4.2-4.2M8.5 11h5\"/></svg>", "bookmark": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 4h12v16l-6-4-6 4z\"/></svg>", "trash": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13\"/></svg>", "swap": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8h13l-3-3M20 16H7l3 3\"/></svg>"};
I.list='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>';
const ORN_SVG={"Romance": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"/><path d=\"M12 7.4V20\"/></svg>", "Adventure": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"5\" r=\"2\"/><path d=\"M12 7v13M8 10h8M5 13c0 4 3 7 7 7s7-3 7-7\"/></svg>", "Gothic": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 4a8 8 0 1 0 5 13A7 7 0 0 1 15 4z\"/><path d=\"M19 3.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z\"/></svg>", "Literary": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 3.5C12 4 7 9 5 19.5\"/><path d=\"M20 3.5c-1 5-4 8-9 9.5l2-3c-2 .5-4 2-5.5 4.5\"/></svg>", "Historical": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 18.5h16M5 18.5L4 8l5 4 3-6 3 6 5-4-1 10.5z\"/><circle cx=\"12\" cy=\"6\" r=\".8\"/></svg>", "Science Fiction": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><ellipse cx=\"12\" cy=\"12\" rx=\"10.5\" ry=\"3.5\" transform=\"rotate(-20 12 12)\"/></svg>", "Horror": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3.2\"/><path d=\"M12 2v2M5 4l1.2 1.6M19 4l-1.2 1.6M12 20v2\"/></svg>", "Detective": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 15.5c2.5 1.6 15.5 1.6 18 0\"/><path d=\"M6.5 15.8 7.5 9c.2-1.2 1-2 2.2-2 .8 0 1.4.6 2.3.6S13.5 7 14.3 7c1.2 0 2 .8 2.2 2l1 6.8\"/><path d=\"M7.2 12.5c3 .8 6.6.8 9.6 0\"/></svg>", "Mystery": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"10\" cy=\"10\" r=\"6\"/><path d=\"M14.5 14.5L20 20\"/><path d=\"M10 7v.01M10 9.5V13\"/></svg>", "Fantasy": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"/><path d=\"M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z\"/></svg>", "_": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l9 9-9 9-9-9z\"/><path d=\"M12 8l4 4-4 4-4-4z\"/></svg>"};
const FALLBACK = [];
const GENRES = {"Horror":"رعب","Mystery":"غموض","Fantasy":"فانتازيا","Science Fiction":"خيال علمي","Fiction":"قصة","Romance":"رومانسية","Adventure":"مغامرة","Historical":"تاريخية","Literary":"أدبية","Detective":"بوليسية","Drama":"دراما","Thriller":"تشويق"};
const minsAr = m => m===1?"دقيقة واحدة":m===2?"دقيقتان":(m>=3&&m<=10)?`${m} دقائق`:`${m} دقيقة`;
const gname = g => GENRES[g] || g || "قصة";
const SHELVES = [{key:"all",label:"الكل"},{key:"reading",label:"أقرأها"},{key:"want",label:"سأقرأها"},{key:"done",label:"أنهيتها"},{key:"fav",label:"المفضلة"}];
const TINTS = ["#151515","#0f1311","#141010","#0f1016","#13110d","#0c0c0c","#120f13"];

const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem("inkverse:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("inkverse:"+k,JSON.stringify(v))}catch(e){}}
};
let state = store.get("state",{});
let view = {shelf:"all",q:"",genre:"",sort:"recent"};
let BOOKS = [], LOADED = false;
const books = () => BOOKS;
const st = id => state[id] || (state[id] = {shelf:"",rating:0,progress:0,fav:false,notes:""});
const save = () => store.set("state",state);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const errMsg = e => (e&&e.message)||(e&&e.code)||"حدث خطأ";

// ---- local cache of downloaded book files ----
const files = {
  mem:new Map(), db:null,
  async init(){ try{ this.db = await new Promise((res,rej)=>{const r=indexedDB.open("inkverse-books",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); }catch(e){this.db=null} },
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction("files",mode);const q=fn(t.objectStore("files"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  async put(id,rec){this.mem.set(id,rec);if(this.db)try{await this.tx("readwrite",s=>s.put(rec,id))}catch(e){}},
  async get(id){if(this.mem.has(id))return this.mem.get(id);if(!this.db)return null;try{const r=await this.tx("readonly",s=>s.get(id));if(r)this.mem.set(id,r);return r}catch(e){return null}}
};

// ---- covers taken from the first page of each book's PDF ----
const COVERS = new Map(), coverTried = new Set();
async function ensureCover(b){
  if(!b.fileId || b.fileType==="txt" || coverTried.has(b.fileId)) return;
  coverTried.add(b.fileId);
  try{
    const key = "cover:"+b.fileId;
    let url = await files.get(key);
    if(!url){
      const rec = await loadBook(b); await loadPdfJs();
      const pdf = await pdfjsLib.getDocument({data:new Uint8Array(rec.data.slice(0))}).promise;
      const page = await pdf.getPage(1), base = page.getViewport({scale:1}), vp = page.getViewport({scale:360/base.width});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      url = c.toDataURL("image/jpeg",.85); files.put(key,url);
    }
    COVERS.set(b.fileId,url); render();
  }catch(e){}
}
function coverHTML(b){
  const tint = TINTS[hash(b.title)%TINTS.length];
  const s = state[b.id]||{};
  const img = b.cover || (b.fileId && COVERS.get(b.fileId));
  if(!img) setTimeout(()=>ensureCover(b),0);
  const badge = s.shelf==="reading" ? `<span class="badge">${s.progress||0}%</span><div class="pb"><i style="width:${s.progress||0}%"></i></div>`
              : s.shelf==="done" ? `<span class="badge">${I.check}</span>` : "";
  if(img) return `<div class="cover img" style="background:#111 url('${encodeURI(img)}') center/cover no-repeat">${s.fav?`<span class="fav"></span>`:""}${badge}</div>`;
  return `<div class="cover" style="background:radial-gradient(ellipse at 70% 15%,rgba(255,255,255,.05),transparent 55%),linear-gradient(165deg,${tint},#030303)">
    ${s.fav?`<span class="fav"></span>`:""}${badge}${b.fileId?`<span class="pdfdot"></span>`:""}
    <div class="orn">${ORN_SVG[b.genre]||ORN_SVG._}</div>
    <div class="ct" dir="auto">${esc(b.title)}</div><div class="ca" dir="auto">${esc(b.author||b.tag||"")}</div></div>`;
}

function filtered(){
  const q = view.q.trim().toLowerCase();
  const list = books().filter(b=>{
    const s = state[b.id]||{};
    if(view.shelf==="fav" && !s.fav) return false;
    if(!["all","fav"].includes(view.shelf) && s.shelf!==view.shelf) return false;
    if(view.genre && b.genre!==view.genre) return false;
    if(q && !`${b.title} ${b.author} ${gname(b.genre)}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const by = {
    title:(x,y)=>x.title.localeCompare(y.title,"ar"), author:(x,y)=>x.author.localeCompare(y.author,"ar"),
    year:(x,y)=>(x.year||9999)-(y.year||9999), yearDesc:(x,y)=>(y.year||0)-(x.year||0),
    rating:(x,y)=>((state[y.id]||{}).rating||0)-((state[x.id]||{}).rating||0),
    recent:(x,y)=>(y.createdAt||0)-(x.createdAt||0)
  };
  return list.sort(by[view.sort]);
}

function render(){
  const all = books();
  const count = k => k==="all"?all.length:k==="fav"?all.filter(b=>(state[b.id]||{}).fav).length:all.filter(b=>(state[b.id]||{}).shelf===k).length;
  $("tabs").innerHTML = SHELVES.map(s=>`<button class="tab ${view.shelf===s.key?"on":""}" data-shelf="${s.key}">${s.label}<b>${count(s.key)}</b></button>`).join("");
  const genres = [...new Set(all.map(b=>b.genre).filter(Boolean))];
  $("genre").innerHTML = `<option value="">كل الأنواع</option>`+genres.map(g=>`<option value="${esc(g)}" ${g===view.genre?"selected":""}>${esc(gname(g))}</option>`).join("");
  $("heading").textContent = view.shelf==="all" ? "قصصي" : SHELVES.find(s=>s.key===view.shelf).label;
  const r = count("reading"), d = count("done");
  $("sub").textContent = LOADED ? [`${all.length} ${all.length===1?"قصة":all.length===2?"قصتان":all.length<=10?"قصص":"قصة"}`, r?`${r} قيد القراءة`:"", d?`${d} أنهيتها`:""].filter(Boolean).join("  ·  ") : "";

  const lid = store.get("lastRead",null), lb = lid && all.find(b=>b.id===lid), ls = lb && state[lid];
  $("cont").innerHTML = (lb && lb.fileId && ls && ls.shelf!=="done") ?
    `<div class="cont" data-cont="${esc(lid)}">${coverHTML(lb)}<div style="min-width:0"><div class="k">أكمل القراءة</div><div class="t" dir="auto">${esc(lb.title)}</div>
     <div class="p">${ls.page?`صفحة ${ls.page}${lb.pages?` من ${lb.pages}`:""} · `:""}${ls.progress||0}%</div><div class="bar2"><i style="width:${ls.progress||0}%"></i></div></div>
     <button class="btn primary go">${I.book} تابع</button></div>` : "";

  const list = filtered(), grid = $("grid");
  const W = grid.clientWidth || 360, mobile = W < 560;
  const gap = mobile?14:22;
  const n = Math.max(3, Math.floor((W+gap)/((mobile?96:128)+gap)));
  const bw = Math.min(150, Math.floor((W-8-gap*(n-1))/n));
  const tf = bw<100?13:bw<120?15:18;
  const rows = []; for(let i=0;i<list.length;i+=n) rows.push(list.slice(i,i+n));
  if(!rows.length) rows.push([]);
  const msg = !LOADED ? "جارٍ فتح المكتبة…" : all.length ? (view.shelf==="all"?"لا توجد نتائج":"لا توجد قصص هنا بعد") : "القصص في الطريق… ✦";
  grid.innerHTML = `<div style="--bw:${bw}px;--tf:${tf}px">` + rows.map(r=>`<div class="shelf" style="gap:${gap}px">${
    r.length ? r.map(b=>`<div class="card" data-id="${esc(b.id)}">${coverHTML(b)}</div>`).join("") : `<div class="empty">${I.book}${msg}</div>`
  }</div><div class="ledge"></div>`).join("") + `</div>`;
}

function openBook(id){
  const b = books().find(x=>x.id===id); if(!b) return;
  const s = st(id), m = $("modal");
  const canResume = s.page>1 && s.fileId===b.fileId;
  m.innerHTML = `<button class="iconbtn close" data-close aria-label="إغلاق">${I.close}</button>
   <div class="mhead">${coverHTML(b)}
    <div class="mbody"><h3 dir="auto">${esc(b.title)}</h3>${b.author?`<div class="by" dir="auto">${esc(b.author)}</div>`:""}
     <div class="chips"><span class="chip">${esc(gname(b.genre))}</span>${b.series?`<span class="chip" dir="auto">${esc(b.series)}</span>`:""}${b.year?`<span class="chip">${b.year}</span>`:""}${b.minutes?`<span class="chip">${minsAr(b.minutes)} قراءة</span>`:""}${b.pages?`<span class="chip">${b.pages} صفحة</span>`:""}</div>
    </div></div>
   ${b.summary?`<p class="summary" dir="auto">${esc(b.summary)}</p>`:""}
   <div class="section">
     ${b.fileId
       ? `<div class="row2"><button class="btn primary big" data-read>${I.book} ${canResume?`تابع من صفحة ${s.page}`:"اقرأ القصة"}</button>
          </div>`
       : `<div class="hint" style="font-size:14px">القصة قيد الكتابة… ✦</div>`}
   </div>
   <div class="section"><h4>تقييمي</h4><div class="stars">${[1,2,3,4,5].map(i=>`<span data-r="${i}" class="${i<=s.rating?"on":""}">${I.star}</span>`).join("")}</div></div>
   <div class="section"><h4>رفّي</h4><div class="row2">
     ${[["want","سأقرأها","bookmark"],["reading","أقرأها","book"],["done","أنهيتها","check"]].map(([k,l,ic])=>`<button class="btn ${s.shelf===k?"on":""}" data-shelfset="${k}">${I[ic]} ${l}</button>`).join("")}
     <button class="btn ${s.fav?"on":""}" data-fav>${s.fav?I.heartf:I.heart} المفضلة</button>
   </div></div>
   <div class="section"><h4>ملاحظاتك للكاتب</h4><textarea id="notes" dir="auto" rows="3" placeholder="سطر أعجبك، فكرة، شخصية، اقتراح…">${esc(s.notes)}</textarea><div class="hint">ملاحظاتك وتقييمك يصلون للكاتب تلقائيًا مع نوع جهازك، لتحسين القصص.</div></div>
`;
  m.dataset.id = id; delete m.dataset.edit;
  $("scrim").classList.add("on");
}

async function loadBook(b){
  if(!b.fileId) return null;
  const isTxt = b.fileType==="txt";
  // stories (text) always come fresh from the site so edits show up; the saved copy is only for offline
  if(!isTxt){ const cached = await files.get(b.fileId); if(cached) return cached; }
  let res;
  try{ res = await fetch(b.fileId,{cache:"no-cache"}); }
  catch(e){ const cached = await files.get(b.fileId); if(cached) return cached; throw new Error("لا يوجد اتصال بالإنترنت."); }
  if(!res.ok){ const cached = await files.get(b.fileId); if(cached) return cached; throw new Error(res.status===404?"القصة غير متاحة بعد.":"تعذّر تحميل القصة."); }
  const buf = await res.arrayBuffer();
  const rec = isTxt ? {type:"txt",text:new TextDecoder().decode(buf)} : {type:"pdf",data:buf};
  files.put(b.fileId,rec);
  return rec;
}

// PDF reader library loads only when a book is opened
let pdfReady=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("تعذّر تحميل قارئ PDF. تأكد من اتصالك."));document.head.appendChild(s)})}
function loadPdfJs(){ if(window.pdfjsLib) return Promise.resolve();
  return pdfReady || (pdfReady = (async()=>{ const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base+"pdf.min.js"); await loadScript(base+"pdf.worker.min.js"); })().catch(e=>{pdfReady=null;throw e})); }

// ---- story typesetting: blank line = new paragraph, "# " = chapter heading, "***" = scene break ----
function renderStory(el, b, text){
  const head = document.createElement("div"); head.className="sthead";
  if(b.cover){ const im=document.createElement("img"); im.src=b.cover; im.alt=""; im.className="stcover"+(b.coverInvert?" inv":""); head.appendChild(im); }
  const t = document.createElement("h1"); t.dir="auto"; t.textContent = b.title; head.appendChild(t);
  const m = document.createElement("div"); m.className="stmeta"; m.textContent = [b.author, b.tag||gname(b.genre), b.minutes?`${minsAr(b.minutes)} قراءة`:""].filter(Boolean).join("  ·  "); head.appendChild(m);
  el.appendChild(head);
  String(text).replace(/\r\n?/g,"\n").split(/\n\s*\n/).forEach(block=>{
    const s = block.trim(); if(!s) return;
    let node;
    if(/^#{1,3}\s/.test(s)){ node=document.createElement("h2"); node.textContent=s.replace(/^#+\s*/,""); }
    else if(/^(\*\s*){3,}$|^[-—]{3,}$|^✦$/.test(s)){ node=document.createElement("div"); node.className="stbreak"; node.textContent="✦"; }
    else { node=document.createElement("p"); node.textContent=s.replace(/\n/g," "); }
    // short lines written in Latin letters (a clue, a word puzzle) stand out centered in gold
    if(node.tagName==="P" && s.length<70 && /[A-Za-z]/.test(s) && !/[\u0600-\u06FF]/.test(s.replace(/[،؛؟]/g,""))) node.className="stclue";
    node.dir="auto"; el.appendChild(node);
  });
  const end=document.createElement("div"); end.className="stend"; end.textContent="✦  النهاية  ✦"; el.appendChild(end);
}
// ---- reader (right-to-left page turning) ----
const R = {id:null,pdf:null,page:1,total:0,zoom:1,type:null,busy:false};
async function openReader(id){
  const b = books().find(x=>x.id===id); if(!b) return;
  const s = st(id);
  if(s.fileId!==b.fileId){s.fileId=b.fileId;s.page=0;s.scroll=0;s.marks=[]}
  Object.assign(R,{id,pdf:null,page:Math.max(1,s.page||1),zoom:1});
  $("rTitle").textContent = b.title;
  try{ if(window.goatcounter && goatcounter.count) goatcounter.count({path:"/قصة/"+b.title, title:b.title, event:true}); }catch(e){}
  store.set("lastRead",id); save();
  $("rMarkList").classList.remove("on");
  $("rStage").innerHTML = '<div class="rload">جارٍ فتح الكتاب…</div>';
  $("reader").classList.add("on");
  try{
    const rec = await loadBook(b); if(!rec) throw new Error("هذه القصة غير متاحة بعد.");
    R.type = rec.type;
    if(rec.type==="txt"){
      $("rNav").style.display="none"; $("rStage").style.display="flex";
      $("rStage").innerHTML = `<article class="rtext" id="rText"></article>`;
      renderStory($("rText"), b, rec.text);
      requestAnimationFrame(()=>{const el=$("rStage");el.scrollTop=(s.scroll||0)*(el.scrollHeight-el.clientHeight)});
      return;
    }
    $("rNav").style.display="flex"; R.slots=[];
    await loadPdfJs();
    R.pdf = await pdfjsLib.getDocument({data:new Uint8Array(rec.data.slice(0))}).promise;
    R.total = R.pdf.numPages;
    if(R.page>R.total) R.page=1;
    $("rTotal").textContent = "من "+R.total; $("rNum").max = R.total;
    await setupScroll();
    if(R.page>1) toast("أهلًا بعودتك — صفحة "+R.page);
  }catch(e){ $("rStage").innerHTML = `<div class="rload">تعذّر فتح القصة<br><small style="font-family:var(--ui);font-size:13px">${esc(errMsg(e))}</small></div>`; }
}
// ---- continuous vertical scrolling through the pages ----
const GAP = 10, PAD = 12;
function slotH(){ return R.w*R.base.height/R.base.width; }
async function setupScroll(){
  const stage=$("rStage"); stage.innerHTML=""; stage.style.display="block";
  const p1=await R.pdf.getPage(1); R.base=p1.getViewport({scale:1});
  const col=document.createElement("div"); col.className="pcol"; stage.appendChild(col);
  R.slots=[]; for(let i=1;i<=R.total;i++){ const d=document.createElement("div"); d.className="pslot"; d.dataset.p=i; d.innerHTML=`<span>${i}</span>`; col.appendChild(d); R.slots.push(d); }
  layoutSlots(); scrollToPage(R.page); renderAround();
  stage.onscroll=()=>{ if(R.raf) return; R.raf=requestAnimationFrame(()=>{ R.raf=0; onScrollPdf(); }); };
  updatePageUI();
}
function layoutSlots(){
  const stage=$("rStage"); R.w=Math.floor(Math.min(stage.clientWidth-20,860)*R.zoom);
  const h=slotH();
  R.slots.forEach(s=>{ s.style.width=R.w+"px"; s.style.height=h+"px"; if(s.dataset.w && +s.dataset.w!==R.w){ s.dataset.w=""; const c=s.querySelector("canvas"); if(c) c.remove(); } });
}
function currentPage(){ const st=$("rStage"); return Math.min(R.total,Math.max(1,Math.floor((st.scrollTop+st.clientHeight*.35-PAD)/(slotH()+GAP))+1)); }
function scrollToPage(p){ $("rStage").scrollTop = PAD + (p-1)*(slotH()+GAP); }
async function renderSlot(p){
  const s=R.slots[p-1]; if(!s || +s.dataset.w===R.w) return; s.dataset.w=R.w; const w=R.w;
  try{
    const page=await R.pdf.getPage(p); if(+s.dataset.w!==w) return;
    const dpr=Math.min(window.devicePixelRatio||1,2), vp=page.getViewport({scale:w/page.getViewport({scale:1}).width});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr);
    await page.render({canvasContext:c.getContext("2d"),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
    if(+s.dataset.w!==w) return; const old=s.querySelector("canvas"); if(old) old.remove(); s.appendChild(c);
  }catch(e){ s.dataset.w=""; }
}
function renderAround(){
  const cur=currentPage();
  for(let p=cur-2;p<=cur+3;p++) if(p>=1&&p<=R.total) renderSlot(p);
  R.slots.forEach((s,i)=>{ if(Math.abs(i+1-cur)>8 && s.dataset.w){ s.dataset.w=""; const c=s.querySelector("canvas"); if(c) c.remove(); } });
}
function updatePageUI(){
  $("rNum").value=R.page;
  $("rMark").classList.toggle("marked",(st(R.id).marks||[]).includes(R.page));
  $("rPrev").disabled=R.page<=1; $("rNext").disabled=R.page>=R.total;
  const pct=Math.round(R.page/R.total*100); $("rProg").style.width=pct+"%";
  const s=st(R.id); s.page=R.page; s.progress=pct;
  if(R.page>=R.total){ if(s.shelf!=="done"){s.shelf="done";toast("انتهت القصة ✦")} } else if(s.shelf!=="done") s.shelf="reading";
  clearTimeout(R.sv); R.sv=setTimeout(save,500);
}
function onScrollPdf(){ if(!R.pdf) return; renderAround(); const p=currentPage(); if(p!==R.page){ R.page=p; updatePageUI(); } }
function go(n){ if(!R.pdf) return; n=Math.min(Math.max(1,n),R.total); R.page=n; scrollToPage(n); renderAround(); updatePageUI(); }
function rezoom(z){ const keep=R.page; R.zoom=z; layoutSlots(); scrollToPage(keep); renderAround(); }
$("rClose").innerHTML=I.close; $("rZoomIn").innerHTML=I.zin; $("rZoomOut").innerHTML=I.zout; $("rMark").innerHTML=I.bookmark; $("rMarks").innerHTML=I.list;
$("rPrev").innerHTML=I.right; $("rNext").innerHTML=I.left;
$("rPrev").onclick=()=>go(R.page-1);
$("rNext").onclick=()=>go(R.page+1);
$("rNum").onchange=e=>go(+e.target.value||1);
const txtSize = d => { const t=$("rText"); if(t) t.style.fontSize=Math.min(34,Math.max(14,parseFloat(getComputedStyle(t).fontSize)+d))+"px"; };
$("rZoomIn").onclick=()=>{ if(R.type==="txt") txtSize(2); else if(R.pdf) rezoom(Math.min(R.zoom+.25,3)); };
$("rZoomOut").onclick=()=>{ if(R.type==="txt") txtSize(-2); else if(R.pdf) rezoom(Math.max(R.zoom-.25,.5)); };
$("rClose").onclick=()=>{ $("reader").classList.remove("on"); R.pdf=null; $("rStage").onscroll=null; save(); render(); if($("scrim").classList.contains("on")&&R.id) openBook(R.id); };
$("rStage").addEventListener("scroll",()=>{
  if(R.type!=="txt") return; const el=$("rStage"); const f=el.scrollTop/Math.max(1,el.scrollHeight-el.clientHeight);
  const s=st(R.id); s.scroll=f; s.progress=Math.round(f*100); $("rProg").style.width=s.progress+"%";
  if(s.progress>=99&&s.shelf!=="done"){s.shelf="done";toast("انتهت القصة ✦")} else if(s.shelf!=="done") s.shelf="reading";
  clearTimeout(R.t); R.t=setTimeout(save,400);
});
document.addEventListener("keydown",e=>{if(!$("reader").classList.contains("on"))return;
  if(e.key==="ArrowLeft"||e.key==="PageDown")go(R.page+1); if(e.key==="ArrowRight"||e.key==="PageUp")go(R.page-1);
  if(e.key==="Escape"){e.stopImmediatePropagation();$("rClose").click()}},true);
window.addEventListener("resize",()=>{ if($("reader").classList.contains("on")&&R.pdf) rezoom(R.zoom); });
function showMarks(){
  const m=(st(R.id).marks||[]).slice().sort((a,b)=>a-b);
  $("rMarkList").innerHTML = `<h5>علاماتي</h5>`+(m.length?m.map(p=>`<button data-go="${p}"><span>صفحة ${p}</span><span style="color:var(--muted)">${R.total?Math.round(p/R.total*100)+"%":""}</span></button>`).join(""):`<div class="none">لا توجد علامات بعد. اضغط زر العلامة لحفظ صفحة.</div>`);
}
$("rMark").onclick=()=>{
  if(R.type==="txt"){toast("مكانك يُحفظ تلقائيًا");return}
  const s=st(R.id); s.marks=s.marks||[]; const i=s.marks.indexOf(R.page);
  if(i>=0){s.marks.splice(i,1);toast("أُزيلت العلامة")}else{s.marks.push(R.page);toast("حُفظت صفحة "+R.page)}
  $("rMark").classList.toggle("marked",i<0); save(); if($("rMarkList").classList.contains("on"))showMarks();
};
$("rMarks").onclick=()=>{if(R.type==="txt"){toast("مكانك يُحفظ تلقائيًا");return}showMarks();$("rMarkList").classList.toggle("on")};
$("rMarkList").onclick=e=>{const b=e.target.closest("[data-go]");if(b){go(+b.dataset.go);$("rMarkList").classList.remove("on")}};
$("rStage").addEventListener("click",()=>$("rMarkList").classList.remove("on"));


// ---- notes reach the writer (readers are told under the box) ----
const NOTES_URL = "https://formspree.io/f/mljbkgjo";
function sendNote(id){
  const s = state[id]; if(!s) return;
  const note = (s.notes||"").trim(), rating = s.rating||0;
  if(!note && !rating) return;
  const key = rating+"|"+note;
  if(key===s.sentKey) return;
  const b = books().find(x=>x.id===id), title = b?b.title:id;
  const stars = rating ? "★".repeat(rating)+"☆".repeat(5-rating)+" ("+rating+"/5)" : "بدون تقييم";
  const ua = navigator.userAgent;
  const os = /iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1) ? "iPad" : /iPhone/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Windows/.test(ua) ? "Windows" : /Mac/.test(ua) ? "Mac" : "جهاز آخر";
  const br = /CriOS|Chrome/.test(ua)&&!/Edg/.test(ua) ? "Chrome" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /Edg/.test(ua) ? "Edge" : /Instagram/.test(ua) ? "Instagram" : /Safari/.test(ua) ? "Safari" : "متصفح آخر";
  s.sentKey = key; save();
  const fail = ()=>{ s.sentKey=""; save(); };
  try{
    fetch(NOTES_URL,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({"القصة":title,"التقييم":stars,"الملاحظة":note||"—","الجهاز":os+" · "+br,_subject:(note?"ملاحظة جديدة":"تقييم جديد")+" على «"+title+"» "+(rating?rating+"★":"")})})
      .then(r=>{ if(!r.ok) fail(); }).catch(fail);
  }catch(e){ fail(); }
}
function closeModal(){ const oid=$("modal").dataset.id; if(oid) sendNote(oid); $("scrim").classList.remove("on"); render(); }
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2200); }

$("searchBtn").innerHTML = I.search;
$("searchBtn").onclick = ()=>{ const r=$("searchRow"); r.classList.toggle("on"); if(r.classList.contains("on")) $("q").focus(); else { $("q").value=""; view.q=""; render(); } };

$("sort").onchange = e=>{view.sort=e.target.value;render()};
$("grid").onclick = e=>{const c=e.target.closest(".card");if(c)openBook(c.dataset.id)};
$("cont").onclick = e=>{const c=e.target.closest("[data-cont]");if(c)openReader(c.dataset.cont)};
$("scrim").onclick = e=>{ if(e.target.id==="scrim") closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

$("modal").addEventListener("click",e=>{
  const id = $("modal").dataset.id;
  if(e.target.closest("[data-close]")) return closeModal();
  if(!id) return;
  const s = st(id);
  if(e.target.closest("[data-read]")) return openReader(id);
  const r = e.target.closest("[data-r]");
  if(r){ const v=+r.dataset.r; s.rating=s.rating===v?0:v; save(); openBook(id); return; }
  const sh = e.target.closest("[data-shelfset]");
  if(sh){ const k=sh.dataset.shelfset; s.shelf=s.shelf===k?"":k; if(k==="done"&&s.shelf) s.progress=100; save(); openBook(id); toast(s.shelf?"أُضيفت إلى رفّك":"أُزيلت من الرف"); return; }
  if(e.target.closest("[data-fav]")){ s.fav=!s.fav; save(); openBook(id); return; }
});
$("modal").addEventListener("input",e=>{ const id=$("modal").dataset.id; if(id && e.target.id==="notes"){ st(id).notes=e.target.value; save(); } });
$("modal").addEventListener("focusout",e=>{ const id=$("modal").dataset.id; if(id && e.target.id==="notes") sendNote(id); });
document.addEventListener("visibilitychange",()=>{ const id=$("modal").dataset.id; if(document.visibilityState==="hidden" && id) sendNote(id); });

// ---- splash screen ----
(()=>{ const sp=$("splash"); if(!sp) return;
  let gone=false; const hide=()=>{ if(gone) return; gone=true; sp.classList.add("out"); setTimeout(()=>sp.remove(),1000); };
  const start=()=>{ sp.classList.add("go"); setTimeout(hide,4000); };
  sp.addEventListener("click",hide);
  Promise.race([document.fonts?document.fonts.ready:Promise.resolve(), new Promise(r=>setTimeout(r,700))]).then(start);
})();

(async()=>{
  try{
    const res = await fetch("books.json",{cache:"no-cache"});
    if(!res.ok) throw 0;
    BOOKS = (await res.json()).map((b,i,a)=>({...b,fileId:b.file||null,fileType:b.file&&/\.txt$/i.test(b.file)?"txt":"pdf",createdAt:a.length-i}));
  }catch(e){ BOOKS = FALLBACK.map((b,i,a)=>({...b,createdAt:a.length-i})); }
  LOADED = true; render();
})();
if("serviceWorker" in navigator){
  // an update never interrupts reading: refresh only when no story is open, otherwise wait until it is closed
  let pendingReload=false, reloaded=false;
  const busy=()=>document.getElementById("reader").classList.contains("on")||document.getElementById("scrim").classList.contains("on");
  const doReload=()=>{ if(reloaded) return; reloaded=true; location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(busy()) pendingReload=true; else doReload(); });
  setInterval(()=>{ if(pendingReload && !busy()) doReload(); },1500);
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); });
}
